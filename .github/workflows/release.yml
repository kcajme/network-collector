name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  EXPECTED_GO_VERSION: go1.27.3
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go toolchain
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN GOPROXY GOSUMDB
          test "$(go env GOVERSION)" = "${EXPECTED_GO_VERSION}"

      - name: Test
        run: go test -race ./...

      - name: Install govulncheck
        run: |
          mkdir -p "${RUNNER_TEMP}/security-tools"
          GOBIN="${RUNNER_TEMP}/security-tools" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "${RUNNER_TEMP}/security-tools" >> "${GITHUB_PATH}"

      - name: Go source and test vulnerability scans
        run: |
          govulncheck -show verbose ./...
          govulncheck -test -show verbose ./...

      - name: Build release artifacts without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish

      - name: Scan every release binary
        run: scripts/scan-release-binaries.sh dist

      - name: Prepare upgrade notes
        run: |
          awk -v section="## [${GITHUB_REF_NAME#v}]" '
            index($0, section) == 1 { found = 1; next }
            found && /^## \[/{ exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md
          (cd dist && sha256sum release-notes.md >> checksums.txt)

      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require configured release reviewers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          reviewers_configured="$(gh api "repos/${GH_REPO}/environments/release" --jq 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0)')"
          if [ "$reviewers_configured" != "true" ]; then
            echo "Configure required reviewers on the release environment before publishing." >&2
            exit 1
          fi

      - name: Download verified artifacts from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-release
          path: dist

      - name: Verify transferred artifacts
        working-directory: dist
        run: sha256sum --check checksums.txt

      - name: Create draft from verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease_args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --draft "${prerelease_args[@]}" --title "${GITHUB_REF_NAME}" --notes-file dist/release-notes.md dist/*.tar.gz dist/checksums.txt dist/release-notes.md

      - name: Attest verified release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          create-storage-record: false

      - name: Publish verified release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
