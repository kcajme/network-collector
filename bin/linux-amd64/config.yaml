name_playbook: Software Upgrade on Cisco IOS
fail_on_fail: true
inventory_file: inventory.yaml
parsers_file: parsers.yaml
security_mode: permissive
ssh_security:
  profile: modern
  host_key_policy: insecure
execution:
  max_parallel: 3
  canary_count: 1
  failure_threshold: 2
  start_internal_seconds: 0
ssh:
  - type: cisco_iosxr
    operation_timeout: 1800
    steps:
      - name: capture-baseline-alarms
        category: 'Pre checks'
        cmd: "show alarms brief system active"
        parser: xr_show_alarms_brief_system_active
        validation:
          extractor: gjson
          json_path: descriptions
          condition: not_contains
          expected: "__never_expected_alarm_marker__"
          expected_type: string
        register: baseline_alarms
        message: "captured baseline active alarms"

      - name: capture-baseline-isis-adj
        category: 'Pre checks'
        cmd: "show isis adjacency"
        parser: xr_show_isis_adjacency
        register: baseline_isis_adj
        message: "captured baseline IS-IS adjacency"

      - name: capture-baseline-ip-brief
        category: 'Pre checks'
        cmd: "show ip interface brief"
        parser: xr_show_ip_interface_brief
        register: baseline_ip_brief
        message: "captured baseline interface"

      - name: configure-backup-user
        category: 'Pre configuration'
        cmd: "conf t"

      - name: create-backup-user
        category: 'Pre configuration'
        cmd: "username ios_install secret 0 R63hcsjnjnc"

      - name: commit-backup-user
        category: 'Pre configuration'
        cmd: "commit"

      - name: exit-configure-backup-user
        category: 'Pre configuration'
        cmd: "end"

      - name: check-backup-user
        category: 'Pre configuration'
        cmd: "show run formal | inc ios_install"
        validation:
          extractor: regex
          pattern: "username ios_install secret 10"
          condition: contains
          expected: ''
          expected_type: string

      - name: install-remove-existing-packages
        category: 'Pre install cleanup'
        cmd: "install deactivate ncs540-eigrp-1.0.0.0-r25221 ncs540-ospf-1.0.0.0-r25221 ncs540-mcast-1.0.0.0-r25221 ncs540-mpls-te-rsvp-1.0.0.0-r25221 ncs540-pon-ctlr-1.0.0.0-r25221 synchronous"
        validation:
          extractor: regex
          pattern: "install deactivate action completed successfully"
          condition: contains
          expected: ''
          expected_type: string

      - name: install-remove-inactive
        category: 'Pre install cleanup'
        cmd: install remove inactive
        validation:
          extractor: regex
          pattern: "Install operation will continue in the background"
          condition: contains
          expected: ''
          expected_type: string

      - name: show-install-request
        category: 'Pre install cleanup'
        cmd: 'show install request'
        retry:
          until_pass: true
          interval_seconds: 60
          max_attempts: 5
        validation:
          extractor: regex
          pattern: "No install operation in progress"
          condition: contains
          expected: ''
          expected_type: string

      - name: install-add-source
        category: 'Installing IOS'
        cmd: 'install add source harddisk:/ NCS540-iosxr-k9-26.2.2-OPTIMISED.tar'
        register: install_id
        register_integer:
          pattern: 'Install operation\s+(\d+)'
          min: 1
          max: 1000

      - name: show-install-request2
        category: 'Installing IOS'
        cmd: 'show install request'
        retry:
          until_pass: true
          interval_seconds: 60
          max_attempts: 20
        validation:
          extractor: regex
          pattern: 'No install operation in progress'
          condition: contains
          expected: ''
          expected_type: string

      - name: install-activate-id
        category: 'Installing IOS'
        cmd: 'install activate id {{install_id}} sync'
        confirmation:
          prompt: '(?i)This install operation will reload the system,\s*continue\?\s*\[yes:no\]:\[yes\]'
          response: 'yes'
        return_to_prompt: false

      - name: wait-for-reboot
        category: 'Reload'
        wait_seconds: 600
        ssh_probe:
          port: 22
          interval_seconds: 60
          max_attempts: 40
          timeout_seconds: 5
          post_wait_seconds: 240

      - name: install-commit-sync
        category: 'Commit IOS'
        cmd: install commit synchronous
        validation:
          extractor: regex
          pattern: "finished successfully"
          condition: contains
          expected: ''
          expected_type: string

      - name: show-hw-module-upgrade
        category: 'FPD checks'
        block:
          steps:
            - name: check-fpd-upgrade-required
              cmd: "show hw-module location all fpd all | utility egrep '^[0-9]+/' | utility cut -c 61-70"
              validation:
                extractor: regex
                pattern: 'NEED UPGD'
                condition: not_contains
                expected: ''
                expected_type: string
              on_pass:
                action: no_op
                message: 'No FPD modules require upgrade'

          rescue:
            - name: upgrade-hw-module
              message: 'FPD modules require upgrade'
              cmd: 'upgrade hw-module location all fpd all'
              validation:
                extractor: regex
                pattern: 'upgrade command issued'
                condition: contains
                expected: ''
                expected_type: string

            - name: show-hw-module-upgrade-check-progress
              cmd: "show hw-module location all fpd all | utility egrep '^[0-9]+/' | utility cut -c 61-70"
              retry:
                until_pass: true
                interval_seconds: 60
                max_attempts: 15
              validation:
                extractor: regex
                pattern: 'NEED UPGD|UPGRADING'
                condition: not_contains
                expected: ''
                expected_type: string

      - name: show-hw-module-reload
        category: 'FPD checks'
        block:
          steps:
            - name: check-fpd-reload-required
              cmd: "show hw-module location all fpd all | utility egrep '^[0-9]+/' | utility cut -c 61-70"
              validation:
                extractor: regex
                pattern: 'RLOAD REQ'
                condition: not_contains
                expected: ''
                expected_type: string
              on_pass:
                action: no_op
                message: 'No FPD modules require reload'

          rescue:
            - name: fpd-module-reload-admin
              message: 'FPD modules require reload'
              cmd: 'admin'

            - name: fpd-module-reload
              cmd: 'reload rack 0'
              confirmation:
                prompt: '(?i)Continue to Reload node'
                response: 'yes'
              return_to_prompt: false

            - name: wait-for-reboot2
              wait_seconds: 600
              ssh_probe:
                port: 22
                interval_seconds: 60
                max_attempts: 40
                timeout_seconds: 5
                post_wait_seconds: 240

            - name: verify-fpd-reload-complete
              cmd: "show hw-module location all fpd all | utility egrep '^[0-9]+/' | utility cut -c 61-70"
              retry:
                until_pass: true
                interval_seconds: 60
                max_attempts: 15
              validation:
                extractor: regex
                pattern: 'RLOAD REQ|UPGRADING'
                condition: not_contains
                expected: ''
                expected_type: string

      - name: show-version
        category: 'Post config'
        cmd: show version
        validation:
          extractor: regex
          pattern: "Version 26.2.2"
          condition: contains
          expected: ''
          expected_type: string
        on_pass:
          action: no_op
          message: "Version 26.2.2, upgrade successful"
        on_fail:
          action: exit
          message: "Version 26.2.2 NOT FOUND, upgrade unsuccessful"

      - name: install-remove-inactive2
        category: 'Post config'
        cmd: install remove inactive
        validation:
          extractor: regex
          pattern: "Install operation will continue in the background"
          condition: contains
          expected: ''
          expected_type: string

      - name: show-install-request3
        category: 'Post config'
        cmd: 'show install request'
        retry:
          until_pass: true
          interval_seconds: 60
          max_attempts: 5
        validation:
          extractor: regex
          pattern: "No install operation in progress"
          condition: contains
          expected: ''
          expected_type: string

      - name: delete-tar
        category: 'Post config'
        cmd: "del /noprompt harddisk:/NCS540-iosxr-k9-26.2.2-OPTIMISED.tar"

      - name: configure-remove-backup-user
        category: 'Post config'
        cmd: "conf t"

      - name: remove-backup-user
        category: 'Post config'
        cmd: "no username ios_install"

      - name: commit-remove-backup-user
        category: 'Post config'
        cmd: "commit"

      - name: exit-remove-backup-user
        category: 'Post config'
        cmd: "end"

      - name: compare-final-alarms
        category: 'Post checks'
        cmd: show alarms brief system active
        parser: xr_show_alarms_brief_system_active
        validation:
          extractor: gjson
          json_path: descriptions
          condition: eq
          expected: "{{baseline_alarms}}"
          expected_type: string
        on_pass:
          message: "no active alarm changes detected"
        on_fail:
          message: "active alarms changed after the workflow"

      - name: compare-final-isis-adjacency
        category: 'Post checks'
        cmd: show isis adjacency
        parser: xr_show_isis_adjacency
        validation:
          extractor: gjson
          json_path: '@this'
          condition: eq
          expected: "{{baseline_isis_adj}}"
          expected_type: string
        on_pass:
          message: "IS-IS adjacency no changes"
        on_fail:
          message: "IS-IS adjacency changed after the workflow"

      - name: compare-final-ip-brief
        category: 'Post checks'
        cmd: show ip interface brief
        parser: xr_show_ip_interface_brief
        validation:
          extractor: gjson
          json_path: '@this'
          condition: eq
          expected: "{{baseline_ip_brief}}"
          expected_type: string
        on_pass:
          message: "IP interface brief checks pass"
        on_fail:
          message: "IP interface brief checks fail"
